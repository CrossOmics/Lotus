[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lotus"       # Package name
version = "0.1.0"
description = "A biological analysis engine for single-cell data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "scanpy>=1.9.0",
    "pandas",
    "numpy",
    "anndata",
    "scipy",
    "matplotlib",
    "cplearn",
    "pydantic>=2.0",
    "loguru",
    "networkx",
    "diagrams",
    "libcst>=1.4.0",
    "gseapy>=1.1.11",
    "celltypist>=1.7.1",
]

[project.scripts]
lotus = "lotus.cli:cli"
lotus-lineage-format = "lotus.cli:cli"

# Go to src and package the lotus folder
[tool.hatch.build.targets.wheel]
packages = ["src/lotus"]
